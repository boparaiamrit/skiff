name: release

# Push a tag like v0.4.5 to build, sign and publish a GitHub release.
# Needs two repository secrets (Settings → Secrets and variables → Actions):
#   SKIFF_KEYSTORE_BASE64    base64 of keys/skiff.keystore
#   SKIFF_KEYSTORE_PASSWORD  contents of keys/skiff.keystore.pass
# The APK is signed with your own key, so it updates existing installs.

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          MANIFEST=$(sed -n 's/.*android:versionName="\([^"]*\)".*/\1/p' android/AndroidManifest.xml)
          if [ "$VERSION" != "$MANIFEST" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match versionName $MANIFEST in AndroidManifest.xml"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check signing secrets
        env:
          KS: ${{ secrets.SKIFF_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SKIFF_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KS" ] || [ -z "$PW" ]; then
            echo "::error::Add the SKIFF_KEYSTORE_BASE64 and SKIFF_KEYSTORE_PASSWORD secrets first (see the top of release.yml)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache-dependency-path: server/go.sum

      - name: Android build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends aapt dalvik-exchange zipalign apksigner

      - name: Web UI
        run: cd web && npm ci

      - name: Signing key
        env:
          KS: ${{ secrets.SKIFF_KEYSTORE_BASE64 }}
          PW: ${{ secrets.SKIFF_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p keys
          printf '%s' "$KS" | base64 -d > keys/skiff.keystore
          printf '%s\n' "$PW" > keys/skiff.keystore.pass
          chmod 600 keys/skiff.keystore keys/skiff.keystore.pass

      - name: APK
        run: |
          ./build.sh
          cp build/skiff.apk "build/skiff-${{ steps.v.outputs.version }}.apk"
          (cd build && sha256sum skiff.apk "skiff-${{ steps.v.outputs.version }}.apk" > SHA256SUMS.txt)

      - name: Remove signing key
        if: always()
        run: rm -rf keys

      - name: Release notes
        run: |
          V="${{ steps.v.outputs.version }}"
          awk -v v="$V" '
            $0 ~ "^## " v "([: ]|$)" { on=1; next }
            on && /^## / { exit }
            on { print }
          ' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "See CHANGELOG.md." > notes.md
          cat >> notes.md <<'EOF'

          ### Install
          Download **skiff.apk** below and open it on an arm64 phone with Android 11 or newer.
          If Play Protect complains, see [Get started](https://github.com/boparaiamrit/skiff#get-started).
          Then Setup → Install, and type `/login` in Terminal → Claude Code.
          EOF
          sed -i 's/^          //' notes.md

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          V="${{ steps.v.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Skiff $V" \
            --notes-file notes.md \
            --verify-tag \
            build/skiff.apk "build/skiff-$V.apk" build/SHA256SUMS.txt
